name: CI — quality gates

# v5 §2: the regression class found in §0 (6 failing tests that had gone
# unnoticed because gates only ran manually during agent sessions) must
# never happen again. Every push and every PR to main runs all gates.
# v6 §A/§B: static-contract gates (i18n seam + a11y labels) join the wall.
# v14-E8: (a) Node 24 — check_a11y_labels.ts is TypeScript executed via
# type stripping (needs Node >=22.6 experimental / >=23.6 default; Node 20
# cannot run it — the gate was red-on-arrival since v6/v7). Built & tested
# on 24 (docs/getting-started.md). (b) css-token-duplication gate joins CI
# (was gate_all.sh-only). (c) the ok()/fail() router-contract gate joins CI
# with a multi-level glob covering the decomposed routers/payments/ package.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        # v10-E10: SHA-pinned (supply-chain rule from gstack /cso Phase 4)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Gate 1 — ruff (lint)
        run: ruff check fb_dashboard api tests scripts

      - name: Gate 2 — pytest (hermetic suite, any order)
        # No env needed — root conftest.py FORCES the full canonical test
        # environment (DB URL, SECRET_KEY, CRON_SECRET, …). Hermeticity
        # means the suite pins its own world regardless of host/CI env.
        # v10-F3: coverage floor 50% — measured 52% at v10; failing under
        # the floor blocks the merge, coverage can only ratchet up.
        run: |
          # Forward order...
          pytest -q --cov=fb_dashboard --cov-fail-under=60
          # ...and reverse order — hermeticity is a GATE, not a hope (v5 §0).
          pytest -q $(ls tests/test_*.py | sort -r | tr '\n' ' ')

      - name: Gate 3 — TypeScript (Node 24)
        # v14-E8: Node 20 → 24. The a11y-labels gate (5b) runs a .ts file via
        # `node` directly — type stripping requires Node >=22.6 (flagged) /
        # >=23.6 (default); Node 20 fails it. getting-started.md: "مبني
        # ومختبر على 24". SHA stays pinned (v10-E10 supply-chain rule).
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install frontend deps
        run: cd fb_dashboard/frontend && npm ci || npm install

      - name: Gate 5a — i18n seam (v6 §A)
        # every user-visible number/date must flow through src/lib/format.ts
        run: python scripts/check_i18n_calls.py

      - name: Gate 5b — a11y labels (v6 §B)
        # every icon-only interactive control must carry an accessible name
        run: cd fb_dashboard/frontend && node ../../scripts/check_a11y_labels.ts

      - name: Gate 5c — WCAG AA contrast, measured (v6 §B)
        # oklch tokens -> sRGB -> WCAG ratio; every core text/bg pair >= 4.5:1
        run: cd fb_dashboard/frontend && node ../../scripts/check_contrast.mjs

      - name: Gate 5d — CSS token duplication (v4 §1.3; in CI since v14)
        # no custom property defined more than allowed in globals.css —
        # was gate_all.sh-only until v14-E8 (D11 finding: gate missing here)
        run: python scripts/check-css-token-duplication.py

      - name: Gate 5e — router response contracts, multi-level (v14)
        # every router file carries the ok()/fail() envelope evidence —
        # EITHER an inline "success" envelope (legacy/documented extended
        # envelopes) OR `from .._responses import` helpers. Multi-level glob
        # covers the decomposed routers/payments/ package (v13-L4).
        # Documented exemptions (see the routers package docstring):
        # payments/__init__.py = pure include aggregator (no endpoints;
        # its five modules each carry ok()) and payments/sse.py = the
        # byte-stream (text/event-stream) exception.
        run: |
          exempt=" fb_dashboard/routers/payments/__init__.py fb_dashboard/routers/payments/sse.py "
          missing=""
          while IFS= read -r r; do
            [[ "$exempt" == *" $r "* ]] && continue
            if ! grep -q '"success"' "$r" && ! grep -q '_responses import' "$r"; then
              missing="$missing $r"
            fi
          done < <(find fb_dashboard/routers -name '*.py' -type f | LC_ALL=C sort)
          if [[ -n "$missing" ]]; then
            echo "router(s) missing the response contract:$missing"
            exit 1
          fi
          echo "router contracts: OK (flat + payments/ package, exemptions documented)"

      - name: Run tsc
        run: cd fb_dashboard/frontend && npx tsc --noEmit

      - name: Gate 3.5 — frontend unit tests (vitest)
        # v11-A5: unit-test wall for the pure-logic seam (format/i18n,
        # API envelope unwrapping, Arabic pluralization, subscribe logic)
        run: cd fb_dashboard/frontend && npx vitest run

      - name: Gate 4 — production build
        run: cd fb_dashboard/frontend && npx next build
