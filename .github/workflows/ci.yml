name: CI — quality gates

# v5 §2: the regression class found in §0 (6 failing tests that had gone
# unnoticed because gates only ran manually during agent sessions) must
# never happen again. Every push and every PR to main runs all gates.
# v6 §A/§B: static-contract gates (i18n seam + a11y labels) join the wall.
# v14-E8: (a) Node 24 — check_a11y_labels.ts is TypeScript executed via
# type stripping (needs Node >=22.6 experimental / >=23.6 default; Node 20
# cannot run it — the gate was red-on-arrival since v6/v7). Built & tested
# on 24 (docs/getting-started.md). (b) css-token-duplication gate joins CI
# (was gate_all.sh-only). (c) the ok()/fail() router-contract gate joins CI
# with a multi-level glob covering the decomposed routers/payments/ package.
# v15-E9: (1) ruff version pinned (C-RUFF1/D9-L12 — the floating install let
# every run resolve a different ruff; 0.6-0.8 crash on ruff.toml's UP045).
# (2) npm ci is STRICT (D9-M3: `|| npm install` greened a broken lockfile).
# (3) secret-scan job (D11-G3, D6-H1 class). (4) osv-scanner job on both
# lockfiles (D11-G9) — explicit --config (dotted-name loading contract).
# (5) static freshness after build (D9-M2: the v12 stale-static class could
# cross a green CI because CI never compared synced static with the repo).
# (6) coverage comment corrected (60, measured 61.77 at v15).

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        # v10-E10: SHA-pinned (supply-chain rule from gstack /cso Phase 4)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # v15-E9 (C-RUFF1): requirements.txt pins ruff>=0.16,<0.17 — no
          # floating extra install (the old bare `pip install ruff` line let
          # CI resolve whatever was latest and made the gate undeterministic).

      - name: Install weasyprint native libs (v15-E9, C-DEP1/D7-F3)
        # weasyprint is now a DECLARED dependency (requirements.txt) so the
        # PDF off-loop guard can never skip cold again — but `import
        # weasyprint` dlopens pango/cairo/harfbuzz/fontconfig. Runner images
        # usually carry them; installing explicitly keeps the guard's
        # presence deterministic instead of image-dependent (the test now
        # FAILS LOUDLY on a missing library — stale-environment class).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 \
            libharfbuzz0b libfontconfig1 libcairo2

      - name: Gate 1 — ruff (lint)
        run: ruff check fb_dashboard api tests scripts

      - name: Gate 2 — pytest (hermetic suite, any order)
        # No env needed — root conftest.py FORCES the full canonical test
        # environment (DB URL, SECRET_KEY, CRON_SECRET, …). Hermeticity
        # means the suite pins its own world regardless of host/CI env.
        # v10-F3→v15: coverage floor 60% (measured 61.77% at v15); failing
        # under the floor blocks the merge, coverage can only ratchet up.
        # v15-E9 (D9-L9): CI now carries gate_all.sh's ONE transparent retry
        # for the documented StaticPool "database is locked" flake class
        # (v13 report; reproduced order-dependent on clean HEAD by E7 —
        # app/startup.py lifespan starts seq/calendar/health loops and its
        # shutdown cancels only _bot_task, so a scheduler tick racing the
        # loop close can strand a transaction). The retry fires ONLY when
        # the failure text names that class — any other failure fails the
        # gate immediately (no blanket re-run).
        run: |
          set -o pipefail
          run_suite () {
            pytest -q --cov=fb_dashboard --cov-fail-under=60 2>&1 | tee /tmp/pytest_run.log
          }
          if ! run_suite; then
            if grep -q "database is locked" /tmp/pytest_run.log; then
              echo "⚠️  pytest failed with the documented 'database is locked' flake class — one transparent retry (v13 policy)…"
              run_suite
            else
              echo "❌ pytest failed (non-flake) — no retry"; exit 1
            fi
          fi
          # Reverse order — hermeticity is a GATE, not a hope (v5 §0).
          if ! pytest -q $(ls tests/test_*.py | sort -r | tr '\n' ' ') 2>&1 | tee /tmp/pytest_rev.log; then
            if grep -q "database is locked" /tmp/pytest_rev.log; then
              echo "⚠️  reverse run hit the documented flake class — one transparent retry…"
              pytest -q $(ls tests/test_*.py | sort -r | tr '\n' ' ')
            else
              echo "❌ pytest (reverse) failed (non-flake) — no retry"; exit 1
            fi
          fi

      - name: Gate 3 — TypeScript (Node 24)
        # v14-E8: Node 20 → 24. The a11y-labels gate (5b) runs a .ts file via
        # `node` directly — type stripping requires Node >=22.6 (flagged) /
        # >=23.6 (default); Node 20 fails it. getting-started.md: "مبني
        # ومختبر على 24". SHA stays pinned (v10-E10 supply-chain rule).
        # v15-E9: npm cache on (D9-L11 — lockfile is stable, CI was slow).
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fb_dashboard/frontend/package-lock.json

      - name: Install frontend deps
        # v15-E9 (D9-M3): STRICT npm ci — no `|| npm install` fallback. The
        # fallback silently "repaired" a lockfile out of sync with
        # package.json and let every later run stay green while the
        # committed lockfile was wrong. .npmrc legacy-peer-deps keeps
        # npm ci healthy on a clean checkout.
        run: cd fb_dashboard/frontend && npm ci

      - name: Gate 5a — i18n seam (v6 §A)
        # every user-visible number/date must flow through src/lib/format.ts
        run: python scripts/check_i18n_calls.py

      - name: Gate 5b — a11y labels (v6 §B)
        # every icon-only interactive control must carry an accessible name
        run: cd fb_dashboard/frontend && node ../../scripts/check_a11y_labels.ts

      - name: Gate 5c — WCAG AA contrast, measured (v6 §B)
        # oklch tokens -> sRGB -> WCAG ratio; every core text/bg pair >= 4.5:1
        run: cd fb_dashboard/frontend && node ../../scripts/check_contrast.mjs

      - name: Gate 5d — CSS token duplication (v4 §1.3; in CI since v14)
        # no custom property defined more than allowed in globals.css —
        # was gate_all.sh-only until v14-E8 (D11 finding: gate missing here)
        run: python scripts/check-css-token-duplication.py

      - name: Gate 5e — router response contracts, multi-level (v14)
        # every router file carries the ok()/fail() envelope evidence —
        # EITHER an inline "success" envelope (legacy/documented extended
        # envelopes) OR `from .._responses import` helpers. Multi-level glob
        # covers the decomposed routers/payments/ package (v13-L4).
        # Documented exemptions (see the routers package docstring):
        # payments/__init__.py = pure include aggregator (no endpoints;
        # its five modules each carry ok()) and payments/sse.py = the
        # byte-stream (text/event-stream) exception.
        run: |
          exempt=" fb_dashboard/routers/payments/__init__.py fb_dashboard/routers/payments/sse.py "
          missing=""
          while IFS= read -r r; do
            [[ "$exempt" == *" $r "* ]] && continue
            if ! grep -q '"success"' "$r" && ! grep -q '_responses import' "$r"; then
              missing="$missing $r"
            fi
          done < <(find fb_dashboard/routers -name '*.py' -type f | LC_ALL=C sort)
          if [[ -n "$missing" ]]; then
            echo "router(s) missing the response contract:$missing"
            exit 1
          fi
          echo "router contracts: OK (flat + payments/ package, exemptions documented)"

      - name: Run tsc
        run: cd fb_dashboard/frontend && npx tsc --noEmit

      - name: Gate 3.5 — frontend unit tests (vitest)
        # v11-A5: unit-test wall for the pure-logic seam (format/i18n,
        # API envelope unwrapping, Arabic pluralization, subscribe logic)
        run: cd fb_dashboard/frontend && npx vitest run

      - name: Gate 4 — production build
        run: cd fb_dashboard/frontend && npx next build

      - name: Gate 4.5 — sync + static freshness (v15-E9, D9-M2)
        # The v12 stale-static incident class: a dev pushes UI changes
        # without running scripts/sync_next_static.py — CI was green (it
        # never compared synced static with the repo) while the api-domain
        # served the OLD build. Here: sync deterministically, then any diff
        # under fb_dashboard/static = RED (commit the synced static before
        # pushing), and the current .next/BUILD_ID must exist in the repo.
        run: |
          python scripts/sync_next_static.py
          BID_FILE=fb_dashboard/frontend/.next/BUILD_ID
          if [[ ! -f "$BID_FILE" ]]; then
            echo "no .next/BUILD_ID — cannot verify freshness"; exit 1
          fi
          BID=$(<"$BID_FILE")
          if [[ ! -d "fb_dashboard/static/_next/static/$BID" ]]; then
            echo "static freshness: buildId $BID missing from fb_dashboard/static/_next/static"; exit 1
          fi
          STALE=$(cd fb_dashboard/static/_next/static && ls -1 | grep -v -x -e "$BID" -e chunks -e media || true)
          if [[ -n "$STALE" ]]; then
            echo "static freshness: stale generation(s): $STALE"; exit 1
          fi
          if [[ -n "$(git status --porcelain -- fb_dashboard/static)" ]]; then
            echo "❌ fb_dashboard/static is STALE vs this build — run scripts/sync_next_static.py locally and commit"; exit 1
          fi
          echo "static freshness: OK (buildId $BID, no stale generations, repo in sync)"

  # ── v15-E9 (D11-G3 · D6-H1): secret-scan gate ────────────────────────────
  # Unicode-hardened (NFKC + zero-width + HTML-entity decode) pattern scan
  # of the whole working tree. stdlib-only — no pip install needed. exit != 0
  # on any finding (DATABASE_URL with password · ghp_ · sntryu_ · PEM keys).
  # This is the CI repeat-prevention of the fb_dashboard/.env history leak.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Gate — secret scan (working tree)
        run: python scripts/secret_scan.py

  # ── v15-E9 (D11-G9): OSV supply-chain scan ───────────────────────────────
  # Pinned release binary (no floating latest). The dotted .osv-scanner.toml
  # is ONLY loaded via the explicit --config flag (gstack G8 lesson: dotted
  # names are never auto-discovered — an implicit load would silently go
  # inert). Both lockfiles scanned: requirements.txt + frontend package-lock.
  # If the download is unavailable in a self-hosted runner: the documented
  # manual step is docs/deployment.md §OSV — same pinned version, same flags.
  osv-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OSV_VERSION: v2.5.1
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install osv-scanner (pinned)
        run: |
          curl -sSfL --retry 3 -o /usr/local/bin/osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
          chmod +x /usr/local/bin/osv-scanner
          # v22: v2.x CLI has NO `version` subcommand — a positional arg is a
          # SCAN TARGET ("failed to resolve path: .../version" → exit≠0, the
          # CI-red class since the v2.5.1 pin). The flag form is the contract.
          osv-scanner --version
      - name: Gate — OSV scan (both lockfiles, explicit config)
        run: |
          osv-scanner scan --config=.osv-scanner.toml \
            --lockfile=requirements.txt \
            --lockfile=fb_dashboard/frontend/package-lock.json
