# Mobile release — بناء تطبيقات العائلة بلا حساب EAS.
#
# المشغلات:
#   - وسم mobile-v* (مثال: git tag mobile-v1.0.0 && git push --tags)
#   - تشغيل يدوي (workflow_dispatch) — يشتق الوسم mobile-v{version|1.0.N}
#
# المخرجات (GitHub Release + artifacts):
#   - Android: APK موقّع إذا ضُبطت أسرار التوقيع (انظر mobile/README.md)،
#     وإلا APK غير موقّع بلاحقة UNSIGNED صريحة (تشغيلة أولى).
#   - iOS: أرشيف .app غير موقّع — التوقيع يتطلب حساب Apple Developer
#     ($99/سنة) ويتم لاحقًا من نفس الأرشيف (README).
#
# الوسم لكل مستودع عام → دقائق Actions مجانية بلا حدود (ubuntu + macOS).
name: Mobile release

on:
  push:
    tags: ['mobile-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'رقم الإصدار (مثل 1.0.0) — فارغ = 1.0.N من رقم التشغيلة'
        required: false
        default: ''
      notes:
        description: 'ملاحظات الإصدار (تُعرض في صفحة الـRelease)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      APP_LABEL: SmartBot
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Dependencies
        run: npm ci

      - name: Gates (typecheck + vitest)
        run: |
          npm run typecheck
          npm run test

      - name: Expo prebuild (android)
        run: npx expo prebuild --platform android --no-install

      - name: Wire release signing
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/release/decode-android-signing.mjs

      - name: Gradle assembleRelease
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs=-Xmx4g

      - name: Collect APK
        run: |
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "../${APP_LABEL}-android.apk"
          else
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk "../${APP_LABEL}-android-UNSIGNED.apk"
            echo "⚠️ APK غير موقّع — اضبط أسرار التوقيع الأربعة (mobile/README.md)"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: SmartBot-android*.apk
          if-no-files-found: error

  ios:
    name: iOS archive (unsigned)
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APP_LABEL: SmartBot
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Dependencies
        run: npm ci

      - name: Expo prebuild (ios)
        run: npx expo prebuild --platform ios --no-install

      - name: CocoaPods
        run: cd ios && pod install

      - name: Xcodebuild (unsigned device build)
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet

      - name: Collect .app archive
        run: |
          cd ios/build/Build/Products/Release-iphoneos
          APP_DIR=$(ls -d *.app | head -1)
          zip -qry "${GITHUB_WORKSPACE}/${APP_LABEL}-ios-unsigned.app.zip" "$APP_DIR"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: SmartBot-ios-unsigned.app.zip
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Compute tag
        id: tag
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            VERSION="${{ inputs.version }}"
            if [ -z "$VERSION" ]; then VERSION="1.0.$GITHUB_RUN_NUMBER"; fi
            echo "tag=mobile-v${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          NOTES="${{ inputs.notes }}"
          if [ -z "$NOTES" ]; then
            NOTES="بناء موبايل تلقائي من ${GITHUB_SHA::7} — Android APK + iOS أرشيف غير موقّع (التوقيع: mobile/README.md)."
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA" \
            dist/android-apk/* dist/ios-app/* \
          || gh release upload "$TAG" dist/android-apk/* dist/ios-app/* --clobber
