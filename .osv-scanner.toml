# OSV-Scanner configuration — v15-E9 (D11-G9: supply-chain CVE gate).
#
# LOADING CONTRACT (gstack lesson G8, learned the hard way there): OSV-Scanner
# only auto-discovers config files named `osv-scanner.toml` (NO leading dot) —
# this file is `.osv-scanner.toml`, so EVERY invocation must pass it
# explicitly:
#
#     osv-scanner scan --config=.osv-scanner.toml \
#         --lockfile=requirements.txt \
#         --lockfile=fb_dashboard/frontend/package-lock.json
#
# CI wires exactly that command (.github/workflows/ci.yml, osv job). The
# dotted name is deliberate (keeps `ls` clean + matches the plan's filename);
# the explicit --config flag is what keeps it from silently going inert.
#
# SUPPRESSION POLICY (gstack contract): every [[IgnoredVulns]] entry MUST
# carry:
#   - id:         the OSV/GHSA advisory id
#   - reason:     >= 20 chars, WHY it is not reachable/fixable now
#   - ignoreUntil: an expiry timestamp — suppressions EXPIRE and must be
#                 re-justified; "permanent exception" = "silent hole".
#
# INITIAL STATE (v15, 2026-09-08): zero active suppressions. The first scan
# of the original floors found 9 advisories (6x PyJWT on the >=2.0.0 floor ·
# 3x python-multipart/pygments on floor-resolved transitives via mcp→rich).
# All were fixed AT THE ROOT by raising the floors in requirements.txt
# (PyJWT>=2.13.0 · python-multipart>=0.0.31 · pygments>=2.20.0 as an explicit
# transitive-security pin) — verified: both lockfiles scan clean. Fix-first
# beats suppress-first; keep it that way.
#
# Template for the first genuinely-needed entry:
#
# [[IgnoredVulns]]
# id = "GHSA-xxxx-xxxx-xxxx"
# reason = "<=20 chars is rejected: explain reachability and why the fixed version is not deployable now>"
# ignoreUntil = 2026-12-31T00:00:00Z

# v22 (2026-09-10) — the first time this gate EVER RAN: v15-E9's pinned
# v2.5.1 CLI carried `osv-scanner version` (a positional SCAN TARGET in the
# v2.x CLI — the job died at the install step on every push since v15,
# silently masking the scan itself). With the command fixed (--version),
# the scan surfaced 6 advisories on the httpx2/httpcore2 TRANSITIVES of
# the 2026 openai/mcp trees (PYSEC-2026-3844..3849 · 3×High CVSS 8.1 —
# httpx2 2.9.1, fixed in 2.10.0/2.12.0 which the SDK trees have not
# shipped yet). Pinning httpx2>=2.12.0 in requirements.txt does NOT clear
# the gate: osv-scanner's requirements.txt resolver resolves each line
# independently and reports the openai/mcp branch's 2.9.1 regardless
# (verified locally against the same pinned CLI); real pip unifies the
# constraint at install time, but an exact-pin conflict with the SDK
# metadata would break `pip install -r` outright. Suppression is therefore
# the honest state: the vulnerable line is a TRANSITIVE we do not import
# (the app imports httpx 0.28.x directly; httpx2 enters only via the SDK
# clients), the fixed versions are not reachable through any requirement
# floor today, and every entry below EXPIRES — re-verify by bumping the
# openai/mcp trees (or removing these entries) at the TTL.
# Reachability note: the serverless runtime never exposes the HTTP client
# of openai/mcp to user-controlled URLs (ai_service SSRF guard + the MCP
# engine is a standalone local process, never imported by the live app).

# P24 (2026-10-24) — expired-unused cleanup + one new entry:
#   · PYSEC-2026-3844..3849 (httpx2/httpcore2): the requirements floors
#     moved past the vulnerable tree — the scanner reported all five
#     entries UNUSED for the whole P24 cycle. Entries removed; a
#     recurrence resolves again and FAILS LOUDLY (no silent hole).
#   · GHSA-vfj7-8cjw-p6xm (braces): WITHDRAWN upstream 2026-10-23
#     (osv.dev shows withdrawn: 2026-10-23T12:53:02Z) — entry removed
#     per its own removal clause. A future braces advisory fails loudly.

