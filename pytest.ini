[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# r137 (صمام التجمّد الصامت — صفر اعتماديات): المرور العكسي في CI
# (تشغيلة r136c) تجمّد صامتًا عند 76% حتى قتله حائط 40 دقيقة للوظيفة
# بلا أي دليل. faulthandler المدمج في pytest: أي اختبار يتجاوز 120 ثانية
# (الجناح كله 1130 اختبار في ~200ث؛ أبطأ اختبار فردي أقل من ثلث ذلك)
# يُفرغ كل تتابعات الخيوط (يُسمّي المتجمّد) ثم يُنهي التشغيل فورًا
# بفشل صاخب بدل أكل الحائط — محليًا وفي كلا مرورَي CI.
faulthandler_timeout = 120
faulthandler_exit_on_timeout = true

